name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No SEMGREP_APP_TOKEN configured: runs the free, local OSS registry
      # rulesets directly, without a Semgrep account or the AppSec Platform.
      - name: Run Semgrep
        run: semgrep scan --config=auto --error
